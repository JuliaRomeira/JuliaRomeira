<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#10161e"/><stop offset="1" stop-color="#0d1117"/></linearGradient></defs>
<style>text{font-family:DejaVu Sans Mono,Consolas,monospace}.cursor{animation:blink 1.2s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cursor{animation:none}}</style>
<rect width="840" height="880" rx="12" fill="url(#bg)"/>
<rect x=".5" y=".5" width="839" height="879" rx="12" fill="none" stroke="#30363d"/>
<path d="M1 58H839" stroke="#252d38"/>
<circle cx="26" cy="29" r="6" fill="#f47067"/><circle cx="48" cy="29" r="6" fill="#d29922"/><circle cx="70" cy="29" r="6" fill="#3fb950"/>
