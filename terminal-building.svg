<text x="48" y="229">{</text>
<text x="80" y="277"><tspan fill="#79c0ff">"name"</tspan>: <tspan fill="#a5d6ff">"Júlia Romeira"</tspan>,</text>
<text x="80" y="325"><tspan fill="#79c0ff">"focus"</tspan>: <tspan fill="#a5d6ff">"Software Development"</tspan>,</text>
<text x="80" y="373"><tspan fill="#79c0ff">"stack"</tspan>: [<tspan fill="#a5d6ff">"Java"</tspan>, <tspan fill="#a5d6ff">"TypeScript"</tspan>, <tspan fill="#a5d6ff">"SQL"</tspan>]</text>
<text x="48" y="421">}</text>
</g>
<path d="M48 461H792" stroke="#212b36"/>
