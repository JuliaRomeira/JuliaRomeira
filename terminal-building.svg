<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880" role="img" aria-labelledby="title desc">
<title id="title">Terminal de desenvolvimento da Júlia</title>
<desc id="desc">Monitor em arte ASCII com símbolo de código e um cursor piscando, no estilo de terminal.</desc>
<style>
text{font-family:DejaVu Sans Mono,Consolas,monospace}
.cursor{animation:blink 1.2s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cursor{animation:none}}
</style>
<rect width="840" height="880" rx="12" fill="#0d1117"/>
<rect x=".5" y=".5" width="839" height="879" rx="12" fill="none" stroke="#30363d"/>
<circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="36" cy="16" r="5" fill="#ffbd2e"/><circle cx="52" cy="16" r="5" fill="#27c93f"/>
<text x="420" y="20" text-anchor="middle" fill="#7d8590" font-size="12">juliaromeira@github: ~$ ./building.sh</text>
<text x="44" y="105" fill="#39d353" font-size="24">julia@github<tspan fill="#7d8590"> ~ $ </tspan><tspan fill="#e6edf3">./building.sh</tspan></text>
<text x="44" y="151" fill="#7d8590" font-size="20">um projeto de cada vez.</text>
